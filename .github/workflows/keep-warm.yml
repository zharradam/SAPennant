name: Keep API warm
# Pings /health every 15 minutes between 7am and 10pm Adelaide time so
# visitors don't hit the F1 cold start (~20-30s). The health check also
# touches the database, keeping Neon's compute warm. Cost: a few
# CPU-seconds per day against the 60 CPU-minute daily quota.
#
# Cron is UTC and can't express Adelaide's half-hour offset or daylight
# saving, so the schedule casts a slightly wide net and the job checks
# actual Adelaide time before pinging.
on:
  schedule:
    - cron: '*/15 20-23 * * *'
    - cron: '*/15 0-12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check Adelaide time window (7am-10pm)
        id: window
        run: |
          hour=$(TZ=Australia/Adelaide date +%-H)
          echo "Adelaide time: $(TZ=Australia/Adelaide date '+%H:%M')"
          if [ "$hour" -lt 7 ] || [ "$hour" -ge 22 ]; then
            echo "Outside the 7am-10pm window — skipping ping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping health endpoint
        if: steps.window.outputs.skip != 'true'
        run: |
          status=$(curl -sS -m 90 --retry 2 -o /dev/null -w "%{http_code}" \
            https://sapennant-api-hhfrhubcgggtbxbv.australiaeast-01.azurewebsites.net/health)
          echo "health returned $status"
          test "$status" = "200"
